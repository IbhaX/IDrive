<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="iDrive">
  <title>iDrive</title>
  <desc>iDrive — The stem is a road in perspective with dashed lane markings, heading to the horizon.</desc>
  <defs><linearGradient id="idrive-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#2F6FD6"/><stop offset="1" stop-color="#1C4796"/>
    </linearGradient>
    <linearGradient id="idrive-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient></defs>
  <style>
    .idrive-tile { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.94);
      animation: idrive-in .55s cubic-bezier(.2,.75,.25,1) forwards; }
    .idrive-stem { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0);
      animation: idrive-in .5s cubic-bezier(.2,.75,.25,1) .15s forwards; }
    .idrive-dot { opacity: 0; transform: translateY(-3px); animation: idrive-in .45s cubic-bezier(.2,.75,.25,1) .38s forwards; }
    .idrive-accent { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.9);
      animation: idrive-in .5s cubic-bezier(.2,.75,.25,1) .58s forwards; }
    .idrive-t2 { animation-delay: .68s; } .idrive-t3 { animation-delay: .78s; }
    @keyframes idrive-in { to { opacity: 1; transform: none; } }
    .idrive-car { opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: idrive-car 2.1s cubic-bezier(.45,0,.3,1) .85s forwards; }
    @keyframes idrive-car { 0% { opacity: 0; transform: translateY(3px); } 14% { opacity: 1; }
      78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-19px) scale(.42); } }
    @media (prefers-reduced-motion: reduce) {
      .idrive-tile, .idrive-stem, .idrive-dot, .idrive-accent, .idrive-wm { animation: none; opacity: 1; transform: none; }
      .idrive-car { display: none; }
    }
  </style>
  <g transform="translate(0 0)">
    <g class="idrive-tile">
      <rect width="64" height="64" rx="14.5" fill="url(#idrive-tile)"/>
      <rect x=".5" y=".5" width="63" height="63" rx="14" fill="none" stroke="url(#idrive-sheen)"/>
    </g>
    <g class="idrive-dot"><circle cx="32" cy="14" r="5.4" fill="#fff"/></g>
    <g class="idrive-stem"><path d="M28.6 24 H35.4 L40.6 51 Q41 53 39 53 H25 Q23 53 23.4 51 Z" fill="#fff"/></g>
    <g class="idrive-accent"><rect x="31.45" y="27" width="1.1" height="3.4" rx=".4" fill="url(#idrive-tile)"/><rect x="31.2" y="34" width="1.6" height="4.6" rx=".5" fill="url(#idrive-tile)"/><rect x="30.9" y="42.2" width="2.2" height="6.6" rx=".6" fill="url(#idrive-tile)"/></g>
    <g class="idrive-car"><rect x="29.4" y="43" width="5.2" height="8" rx="1.7" fill="url(#idrive-tile)"/><rect x="30.2" y="44.6" width="3.6" height="1.9" rx=".6" fill="#fff" fill-opacity=".85"/></g>
  </g>
</svg>
